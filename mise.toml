[tools]
go = "1.26.7"
node = "22"

[env]
_.path = [".mise/scripts", "agents/hermes/pm"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/materialize-env.sh'"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link:agentfiles"

[tasks."link:agentfiles"]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"

[tasks."skills:sync"]
description = "Reconcile this project's selected skills"
tools = { "npm:@delorenj/skillex" = { version = "0.1.1", allow_low_downloads = true }, node = "24" }
run = "skillex sync --scope project --project '{{config_root}}'"

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "'{{config_root}}/.mise/scripts/versioning.sh' current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "'{{config_root}}/.mise/scripts/versioning.sh' check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "'{{config_root}}/.mise/scripts/versioning.sh' sync"
# <<< mise-versioning <<<

[tasks.build]
description = "Build the canonical local ssbnk image"
run = "docker build --build-arg REVISION=$(git rev-parse HEAD) --build-arg VERSION=$(git describe --tags --always --dirty) -t ssbnk:dev ."

[tasks.test]
description = "Run all source and frontend checks"
depends = ["test:go", "test:ui", "test:macos", "test:linux", "lint:linux", "typecheck:linux"]

[tasks."test:go"]
description = "Run Go race tests, vet, and reachable-vulnerability analysis"
run = "cd watcher && go test -race ./... && go vet ./... && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./..."

[tasks."test:ui"]
description = "Install and build the same-origin frontend"
run = "cd ui && npm ci && npm audit --audit-level=high && npm run build && ! rg 'ss\\.delo\\.sh' dist"

[tasks."test:macos"]
description = "Run deterministic tests for the native macOS client"
tools = { swift = "6.3.3" }
run = "cd clients/macos && swift test"

[tasks."build:macos"]
description = "Build the native macOS menu-bar client for Apple Silicon"
tools = { swift = "6.3.3" }
run = "cd clients/macos && swift build -c release --arch arm64"

[tasks."package:macos"]
description = "Test, Developer-ID sign, and assemble the native macOS client DMG"
tools = { swift = "6.3.3" }
run = "clients/macos/scripts/build-dmg.sh"

[tasks."test:linux"]
description = "Run durable Linux core and adapter counterexamples without GI on the worker"
run = "PYTHONPATH=clients/linux/src python3 -m unittest discover -s clients/linux/tests -p 'test_*.py'"

[tasks."lint:linux"]
description = "Check Linux client and packaging source with pinned Ruff"
run = "uvx ruff@0.15.7 check clients/linux"

[tasks."typecheck:linux"]
description = "Strictly type-check the standard-library core; GI remains a distro desktop boundary"
run = "uvx mypy@1.19.1 --config-file clients/linux/pyproject.toml clients/linux/src/ssbnk_client/config.py clients/linux/src/ssbnk_client/store.py clients/linux/src/ssbnk_client/scanner.py clients/linux/src/ssbnk_client/upload.py clients/linux/src/ssbnk_client/worker.py clients/linux/src/ssbnk_client/credentials.py clients/linux/src/ssbnk_client/session.py clients/linux/src/ssbnk_client/clipboard.py clients/linux/src/ssbnk_client/autostart.py"

[tasks."package:linux:deb"]
description = "Build Debian artifact; requires distro dpkg-deb and Python 3.12+"
run = "python3 clients/linux/scripts/package.py deb"

[tasks."package:linux:arch"]
description = "Build Arch artifact with makepkg on a disposable Arch qualification system"
run = "python3 clients/linux/scripts/package.py arch"

[tasks."package:linux:gnome"]
description = "Pack GNOME 46/50 companion using distro gnome-extensions tooling"
run = "python3 clients/linux/scripts/package.py gnome"

[tasks."dev:init"]
description = "Create disposable local bind-mount directories"
run = "mkdir -p .dev-data/data/archive .dev-data/data/hosted .dev-data/data/metadata .dev-data/data/state .dev-data/screenshots .dev-data/screencasts"

[tasks.dev]
description = "Build and run the isolated development stack"
depends = ["dev:init"]
run = "docker compose -f compose.dev.yml up --build"

[tasks."dev:down"]
description = "Stop the development stack"
run = "docker compose -f compose.dev.yml down --remove-orphans"

[tasks."dev:cleanup"]
description = "Preview native retention cleanup against development data"
depends = ["dev:init"]
run = "docker compose -f compose.dev.yml --profile maintenance run --rm --no-deps cleanup"

[tasks."dev:clipboard"]
description = "Start the Wayland-socket-isolated development clipboard bridge"
depends = ["dev:init"]
run = "docker compose -f compose.dev.yml --profile desktop up --build clipboard"
