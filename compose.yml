services:
  ssbnk-watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    container_name: ssbnk-watcher
    restart: unless-stopped
    volumes:
      - ${SSBNK_SCREENSHOT_DIR}:/media/screenshots
      - ${SSBNK_SCREENCAST_DIR}:/media/screencasts
      - /home/delorenj/data/ssbnk/hosted:/data/hosted
      - /home/delorenj/data/ssbnk/metadata:/data/metadata
      - /tmp/ssbnk:/tmp/ssbnk
      # Wayland clipboard access (unix socket, not network)
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/user/1000:rw
      # X11 fallback
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/run/user/1000
      - XDG_SESSION_TYPE=${XDG_SESSION_TYPE:-wayland}
      - SSBNK_URL=https://${SSBNK_DOMAIN}
      - SSBNK_SCREENSHOT_DIR=/media/screenshots
      - SSBNK_SCREENCAST_DIR=/media/screencasts
      - SSBNK_DATA_DIR=/data
      - SSBNK_API_PORT=80
      - SSBNK_UPLOAD_KEY=${SSBNK_UPLOAD_KEY}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ssbnk.entrypoints=websecure"
      - "traefik.http.routers.ssbnk.rule=Host(`${SSBNK_DOMAIN}`)"
      - "traefik.http.routers.ssbnk.tls=true"
      - "traefik.http.routers.ssbnk.tls.certresolver=letsencrypt"
      - "traefik.http.services.ssbnk.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

  ssbnk-cleanup:
    image: alpine:latest
    container_name: ssbnk-cleanup
    restart: unless-stopped
    volumes:
      - /home/delorenj/data/ssbnk/hosted:/data/hosted
      - /home/delorenj/data/ssbnk/metadata:/data/metadata
      - /home/delorenj/data/ssbnk/archive:/data/archive
      - ./scripts/cleanup.sh:/cleanup.sh:ro
    environment:
      - SSBNK_RETENTION_DAYS=${SSBNK_RETENTION_DAYS:-30}
    command: |
      sh -c '
      chmod +x /cleanup.sh
      echo "0 2 * * * /cleanup.sh" | crontab -
      crond -f -l 2'

networks:
  proxy:
    external: true
