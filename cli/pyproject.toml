[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssbnk-cli"
version = "0.1.0"
description = "Typer CLI for ssbnk screenshot hosting"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
ssbnk = "ssbnk_cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
